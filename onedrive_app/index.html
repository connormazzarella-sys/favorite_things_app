<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Favorite Things</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <h1>My Favorite Things</h1>
    <button id="loginBtn">Sign in with Microsoft</button>
    <span id="userLabel"></span>
  </header>

  <main id="app" hidden>
    <section id="uploadSection">
      <label for="fileInput">Add a song</label>
      <input id="fileInput" type="file" accept=".mp3,.m4a">
      <div id="uploadStatus" class="hint"></div>
    </section>

    <section id="librarySection">
      <h2>Library</h2>
      <button id="refreshBtn">Refresh</button>
      <ul id="trackList"></ul>
    </section>

    <footer id="player">
      <div id="nowPlaying">---</div>
      <audio id="audioPlayer" controls></audio>
    </footer>
  </main>

  <!-- msal-browser, pinned to the 5.x major line via jsdelivr's version-range alias -->
  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@5/lib/msal-browser.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
