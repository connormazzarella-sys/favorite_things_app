<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Favorite Things</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#4285F4">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <button id="libBackBtn" class="icon-btn" hidden>&#8592;</button>
    <h1 id="topTitle">My Favorite Things</h1>
    <button id="libAddBtn" class="icon-btn" hidden>&#10133;</button>
    <button id="loginBtn">Sign in with Google</button>
    <span id="userLabel"></span>
  </header>

  <main id="app" hidden>
    <!-- LIBRARY TAB -->
    <section id="librarySection" class="tab-section">
      <div id="lib-genreView" class="view">
        <ul id="genreList" class="genre-list"></ul>
      </div>
      <div id="lib-albumView" class="view" hidden>
        <div id="albumGrid" class="album-grid"></div>
      </div>
      <div id="lib-songView" class="view" hidden>
        <ul id="songList" class="song-list"></ul>
      </div>
    </section>

    <!-- RADIO TAB -->
    <section id="radioSection" class="tab-section" hidden>
      <div class="view">
        <div class="search-row">
          <input id="radioSearchInput" type="text" placeholder="Search stations (e.g. NPR, jazz)">
          <button id="radioSearchBtn">Search</button>
        </div>
        <div id="radioStatus" class="hint"></div>
        <h3>Results</h3>
        <div id="radioResults" class="radio-list"></div>
        <h3>My Stations</h3>
        <div id="radioSaved" class="radio-list"></div>
        <audio id="radioAudio" controls hidden></audio>
      </div>
    </section>
  </main>

  <!-- Add Album modal -->
  <div id="addAlbumModal" class="modal-overlay" hidden>
    <div class="modal-box">
      <h3 id="addAlbumHeading">Add Album</h3>
      <form id="albumUploadForm">
        <label>Album</label>
        <input id="albumNameInput" placeholder="Album name" required>
        <label>Artist</label>
        <input id="albumArtistInput" placeholder="Artist name">
        <label>Cover image (optional)</label>
        <input id="albumCoverFile" type="file" accept="image/*">
        <label>Songs (.mp3)</label>
        <input id="albumSongFiles" type="file" accept=".mp3,.m4a" multiple required>
        <div class="modal-actions">
          <button type="button" id="cancelAlbumUpload">Cancel</button>
          <button type="submit">Add</button>
        </div>
      </form>
      <div id="albumUploadStatus" class="hint"></div>
    </div>
  </div>

  <footer id="player" hidden>
    <div id="nowPlaying">
      <div id="nowPlayingTitle">---</div>
      <div id="nowPlayingArtist"></div>
    </div>
    <audio id="audio" controls></audio>
    <div class="player-controls">
      <button id="prevBtn" class="icon-btn">&#9198;</button>
      <button id="shuffleBtn" class="icon-btn">&#128256; OFF</button>
      <button id="nextBtn" class="icon-btn">&#9197;</button>
    </div>
  </footer>

  <nav id="bottomNav">
    <button class="nav-btn active" data-tab="library">&#127925;<span>Library</span></button>
    <button class="nav-btn" data-tab="radio">&#128225;<span>Radio</span></button>
  </nav>

  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsmediatags@3.9.7/dist/jsmediatags.min.js"></script>
  <script src="config.js"></script>
  <script src="offline-db.js"></script>
  <script src="drive-api.js"></script>
  <script src="auth.js"></script>
  <script src="library.js"></script>
  <script src="radio.js"></script>
  <script src="main.js"></script>
</body>
</html>
